<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORMA Fitness Planner</title>
<style>
:root{--bg:#f1f2ee;--card:#fff;--ink:#14171c;--mute:#5d636d;--line:#dcded8;--blue:#2447ff;--coral:#ff5a36;--green:#1b9e5a;--dark:#14171c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1d23;--ink:#eef0f3;--mute:#9aa1ab;--line:#2b3038;--blue:#5b78ff;--dark:#2b3038}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:84px}
header{background:var(--dark);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px;letter-spacing:.08em;font-weight:900}header span{font-size:14px;opacity:.8}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 2px 8px;font-size:11px;font-weight:700;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--blue)}
@media(min-width:760px){nav{position:static;justify-content:center;gap:4px;border:0;border-bottom:1px solid var(--line)}nav button{flex:0 1 120px;font-size:13px}body{padding-bottom:30px}}
main{max-width:980px;margin:0 auto;padding:18px}
h2{font-size:26px;margin:4px 0 14px;font-weight:900}h3{font-size:16px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
button.b{background:var(--blue);color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
button.b.s{background:var(--dark);color:#fff}button.b.d{background:transparent;color:var(--coral);box-shadow:inset 0 0 0 2px var(--coral)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.big{font-size:44px;font-weight:900;line-height:1}.mute{color:var(--mute);font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}.bar i.over{background:var(--coral)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.n{flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.st{background:var(--dark);color:#fff;border-radius:10px;padding:14px}.st b{font-size:30px;font-weight:900;display:block;line-height:1.1}.st span{font-size:12px;opacity:.75}.st.a{background:var(--blue);color:#fff}
.days{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.days button{flex:1;min-width:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 4px;font-weight:700;cursor:pointer}
.days button.on{background:var(--dark);color:#fff;border-color:var(--dark)}.days button.t{border-color:var(--coral)}.days button.dn::after{content:" ✓";color:var(--green)}
.ex{display:grid;grid-template-columns:28px 1fr 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ex:last-child{border:0}
.ex.dn span{text-decoration:line-through;opacity:.55}.ex small{display:block;color:var(--mute);font-size:12px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.li button{border:0;background:none;color:var(--coral);font-size:18px;cursor:pointer}
.w{display:flex;gap:6px;flex-wrap:wrap}.w button{width:40px;height:44px;border-radius:8px;border:2px solid var(--blue);background:none;font-size:20px;cursor:pointer}.w button.f{background:var(--blue)}
svg.ch{width:100%;height:210px;background:var(--bg);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
details{margin-bottom:14px}summary{cursor:pointer;font-weight:800;padding:8px 0}
.tag{display:inline-block;background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px}
@media print{nav,header,button{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<header><b>FORMA</b><span id="hello"></span></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
/* ---------- state (saved in this browser, offline) ---------- */
const K='forma_fitness_v1',$=s=>document.querySelector(s);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY=iso(new Date()),DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DOW=(new Date().getDay()+6)%7;
const PU=["Pull","Deadlift 3x5","Lat pulldown 4x10","Barbell row 3x10","Face pull 3x15","Biceps curl 3x12"],PS=["Push","Bench press 4x8","Overhead press 3x10","Incline DB press 3x10","Lateral raise 3x15","Triceps pushdown 3x12"],LG=["Legs","Squat 4x8","Romanian deadlift 3x10","Leg press 3x12","Leg curl 3x12","Calf raise 4x15"],RS=["Rest"];
const TPL={
ppl:{n:"Men: Push / Pull / Legs (6 days)",d:[PS,PU,LG,PS,PU,LG,RS]},
glute:{n:"Women: Glutes & Toning (5 days)",d:[["Glutes & Legs","Hip thrust 4x10","Goblet squat 3x12","Romanian deadlift 3x10","Cable kickback 3x15"],["Upper & Core","Lat pulldown 3x12","DB shoulder press 3x12","Push-ups 3xmax","Plank 3x45s"],RS,["Glutes","Bulgarian split squat 3x10","Hip thrust 4x12","Abductor machine 3x20","Back extension 3x15"],["Full Body","Leg press 3x12","Seated row 3x12","Incline DB press 3x12","Dead bug 3x12"],["Cardio","Incline walk 35 min","Stretching 10 min"],RS]},
full:{n:"Beginner Full Body (3 days)",d:[["Full Body A","Squat 3x10","Bench press 3x10","Seated row 3x10","Plank 3x30s"],RS,["Full Body B","Deadlift 3x6","Overhead press 3x10","Lat pulldown 3x10","Lunges 3x10"],RS,["Full Body C","Leg press 3x12","Incline DB press 3x12","Cable row 3x12","Crunches 3x15"],["Walk","30 min easy walk"],RS]},
home:{n:"Home Workout, no equipment (4 days)",d:[["Lower","Bodyweight squat 4x20","Lunges 3x12 each","Glute bridge 4x20","Wall sit 3x40s"],["Upper","Push-ups 4xmax","Pike push-ups 3x10","Chair dips 3x12","Superman 3x15"],RS,["Core & Cardio","Burpees 4x10","Mountain climbers 4x30s","Plank 3x45s","Leg raises 3x15"],["Full Body","Jump squats 3x15","Push-ups 3xmax","Reverse lunges 3x12","Plank 3x45s"],["Walk","40 min walk"],RS]}};
const FOODS=[["Egg (1)",78,6,.6,5],["Chicken breast 100g",165,31,0,3.6],["Rice cooked 1 cup",205,4.3,45,.4],["Oats 40g",150,5,27,3],["Banana (1)",105,1.3,27,.4],["Milk 1 cup",150,8,12,8],["Roti / chapati (1)",100,3,18,2],["Dal 1 cup",230,18,40,1],["Greek yogurt 170g",100,17,6,.7],["Whey protein scoop",120,24,3,1.5],["Peanut butter 1 tbsp",95,4,3,8],["Salmon 100g",208,20,0,13],["Apple (1)",95,.5,25,.3],["Bread slice",80,3,15,1],["Almonds 28g",164,6,6,14],["Beef lean 100g",250,26,0,15],["Paneer 100g",265,18,1.2,21],["Potato medium",160,4,37,.2],["Broccoli 1 cup",55,3.7,11,.6],["Olive oil 1 tbsp",119,0,0,13.5],["Tuna can",120,26,0,1],["Pasta cooked 1 cup",220,8,43,1.3],["Avocado half",160,2,9,15],["Sweet potato medium",112,2,26,.1]];
const MEALS=['Breakfast','Lunch','Dinner','Snacks'];
const def=()=>({p:{name:'',sex:'m',age:28,ht:172,wt:75,act:1.55,goal:-.2},tpl:'ppl',plan:TPL.ppl.d.map(a=>({t:a[0],ex:a.slice(1)})),log:{},food:{},daily:{},wts:[],ms:[],meal:{},groc:'',set:0});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='today',wd=DOW,fd=TODAY,met='waist';
/* ---------- calculations ---------- */
function T(){const p=S.p,bmr=10*p.wt+6.25*p.ht-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.act,cal=Math.round(tdee*(1+ +p.goal)),pro=Math.round(p.wt*2),fat=Math.round(cal*.27/9),carb=Math.max(0,Math.round((cal-pro*4-fat*9)/4)),h=p.ht/100;
return{bmr:Math.round(bmr),tdee:Math.round(tdee),cal,pro,fat,carb,bmi:+(p.wt/(h*h)).toFixed(1),water:Math.max(6,Math.ceil(p.wt*35/250)),lo:Math.round(18.5*h*h),hi:Math.round(24.9*h*h)}}
const foods=d=>S.food[d]||[],tot=d=>foods(d).reduce((a,f)=>({c:a.c+f.c,p:a.p+f.p,k:a.k+f.k,f:a.f+f.f}),{c:0,p:0,k:0,f:0});
const dl=d=>S.daily[d]||(S.daily[d]={water:0,sleep:'',steps:''});
const lg=d=>S.log[d]||(S.log[d]={});
const wkDates=()=>{const m=new Date();m.setDate(m.getDate()-DOW);return DN.map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return iso(x)})};
const wDone=d=>Object.values(S.log[d]||{}).some(v=>v.d);
const active=d=>wDone(d)||foods(d).length||(S.daily[d]&&S.daily[d].water>0);
function streak(){let n=0,d=new Date();if(!active(iso(d)))d.setDate(d.getDate()-1);while(active(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const pct=(a,b)=>Math.min(100,b?Math.round(a/b*100):0);
const r1=n=>Math.round(n*10)/10;
function lastW(name){const ds=Object.keys(S.log).filter(d=>d<TODAY).sort().reverse();for(const d of ds){const v=S.log[d][name];if(v&&v.w)return v.w}return''}
/* ---------- chart ---------- */
function chart(pts,unit){if(pts.length<2)return`<p class="mute" style="padding:30px 0;text-align:center">Add at least 2 entries to see your chart.</p>`;
const v=pts.map(p=>p.y),mn=Math.min(...v)-1,mx=Math.max(...v)+1,xy=pts.map((p,i)=>[40+i*(540/(pts.length-1)),180-(p.y-mn)/(mx-mn)*150]);
return`<svg class="ch" viewBox="0 0 600 210" preserveAspectRatio="none" role="img" aria-label="chart"><polyline fill="none" stroke="#2447ff" stroke-width="3" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#ff5a36"/><text x="${p[0]}" y="${p[1]-9}" font-size="12" text-anchor="middle" fill="currentColor">${pts[i].y}</text>`).join('')}<text x="40" y="203" font-size="11" fill="currentColor">${pts[0].x}</text><text x="580" y="203" font-size="11" text-anchor="end" fill="currentColor">${pts[pts.length-1].x}</text></svg>`}
/* ---------- views ---------- */
const V={};
V.today=()=>{const t=T(),e=tot(TODAY),d=dl(TODAY),pl=S.plan[DOW],ex=pl.ex,done=ex.filter(x=>(S.log[TODAY]||{})[x.replace(/\s\d.*$/,'')+'|'+x]?.d).length,wk=wkDates().filter(wDone).length,left=t.cal-e.k,lw=S.wts.slice(-1)[0];
return`<h2>Today</h2><div class="grid"><div class="card"><h3>Calories</h3><div class="big">${Math.abs(left)}</div><div class="mute">${left>=0?'kcal remaining':'kcal over target'} (goal ${t.cal})</div><div class="bar"><i class="${left<0?'over':''}" style="width:${pct(e.k,t.cal)}%"></i></div>
<div class="mute">Protein ${Math.round(e.p)} / ${t.pro}g</div><div class="bar"><i style="width:${pct(e.p,t.pro)}%"></i></div><div class="mute">Carbs ${Math.round(e.c)} / ${t.carb}g</div><div class="bar"><i style="width:${pct(e.c,t.carb)}%"></i></div><div class="mute">Fat ${Math.round(e.f)} / ${t.fat}g</div><div class="bar"><i style="width:${pct(e.f,t.fat)}%"></i></div><button class="b" onclick="go('diet')">Log food</button></div>
<div class="card"><h3>Water (${d.water} / ${t.water} glasses)</h3><div class="w">${Array.from({length:t.water},(_,i)=>`<button class="${i<d.water?'f':''}" onclick="setW(${i+1})" aria-label="glass ${i+1}">💧</button>`).join('')}</div><br><div class="row"><div><label>Sleep (hours)</label><input type="number" step=".5" value="${d.sleep}" onchange="dl(TODAY).sleep=this.value;save()"></div><div><label>Steps</label><input type="number" value="${d.steps}" onchange="dl(TODAY).steps=this.value;save()"></div></div></div>
<div class="card"><h3>Today's workout: ${pl.t}</h3>${pl.t==='Rest'?'<p class="mute">Rest day. Sleep well, drink water, go for a walk.</p>':`<div class="big">${done}/${ex.length}</div><div class="mute">exercises done</div><div class="bar"><i style="width:${pct(done,ex.length)}%"></i></div>`}<button class="b" onclick="wd=DOW;go('work')">Open workout</button></div>
<div class="card"><h3>Quick weigh-in</h3><div class="row"><input id="qw" type="number" step=".1" placeholder="${lw?lw.w+' kg last':'kg'}"><button class="b n" onclick="addW($('#qw').value)">Save</button></div><br><div class="stats"><div class="st a"><b>${streak()}</b><span>day streak</span></div><div class="st"><b>${wk}</b><span>workouts this week</span></div></div></div></div>`};
V.work=()=>{const wk=wkDates(),pl=S.plan[wd],l=S.log[wk[wd]]||{};
return`<h2>Workout Planner</h2><div class="card"><label>Plan template</label><div class="row"><select id="tp">${Object.entries(TPL).map(([k,v])=>`<option value="${k}" ${S.tpl===k?'selected':''}>${v.n}</option>`).join('')}</select><button class="b n s" onclick="loadT()">Load plan</button></div></div>
<div class="days">${DN.map((n,i)=>`<button class="${i===wd?'on':''} ${i===DOW?'t':''} ${wDone(wk[i])?'dn':''}" onclick="wd=${i};render()">${n}</button>`).join('')}</div>
<div class="card"><h3>${DN[wd]}: ${pl.t} <span class="mute">${wk[wd]}</span></h3>${pl.t==='Rest'?'<p class="mute">Rest and recovery day.</p>':pl.ex.map((x,i)=>{const nm=x.replace(/\s\d.*$/,''),k=nm+'|'+x,v=l[k]||{},lw=lastW(k);return`<div class="ex ${v.d?'dn':''}"><input type="checkbox" ${v.d?'checked':''} onchange="lx(${wd},'${k.replace(/'/g,"\\'")}','d',this.checked)" aria-label="done"><div><span>${x}</span>${lw?`<small>Last time: ${lw} kg</small>`:''}</div><input type="number" step=".5" placeholder="kg" value="${v.w||''}" onchange="lx(${wd},'${k.replace(/'/g,"\\'")}','w',this.value)"></div>`}).join('')}</div>
<details><summary>Edit my weekly plan</summary><p class="mute" style="margin-bottom:8px">First line = day name (or "Rest"). One exercise per line, like "Squat 4x8".</p><div class="grid">${S.plan.map((p,i)=>`<div class="card"><label>${DN[i]}</label><textarea onchange="ep(${i},this.value)">${[p.t,...p.ex].join('\n')}</textarea></div>`).join('')}</div></details>`};
V.diet=()=>{const e=tot(fd),t=T(),fl=foods(fd);
return`<h2>Diet & Calories</h2><div class="card"><div class="row"><div><label>Date</label><input type="date" value="${fd}" onchange="fd=this.value||TODAY;render()"></div></div><div class="stats" style="margin-top:12px"><div class="st a"><b>${Math.round(e.k)}</b><span>of ${t.cal} kcal</span></div><div class="st"><b>${Math.round(e.p)}g</b><span>protein</span></div><div class="st"><b>${Math.round(e.c)}g</b><span>carbs</span></div><div class="st"><b>${Math.round(e.f)}g</b><span>fat</span></div></div></div>
<div class="grid"><div class="card"><h3>Add from food list</h3><div class="g2"><div><label>Meal</label><select id="fm">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>Servings</label><input id="fq" type="number" step=".25" value="1"></div></div><label>Food</label><select id="ff">${FOODS.map((f,i)=>`<option value="${i}">${f[0]} (${f[1]} kcal)</option>`).join('')}</select><br><br><button class="b" onclick="addF()">Add food</button></div>
<div class="card"><h3>Add custom food</h3><div class="g2"><div><label>Name</label><input id="cn"></div><div><label>Meal</label><select id="cm">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div></div><div class="g2"><div><label>kcal</label><input id="ck" type="number"></div><div><label>Protein g</label><input id="cp" type="number"></div><div><label>Carbs g</label><input id="cc" type="number"></div><div><label>Fat g</label><input id="cf" type="number"></div></div><button class="b" onclick="addC()">Add custom</button></div></div>
${MEALS.map(m=>{const it=fl.map((f,i)=>({...f,i})).filter(f=>f.m===m);return`<div class="card"><h3>${m} <span class="mute">${Math.round(it.reduce((a,f)=>a+f.k,0))} kcal</span></h3>${it.length?it.map(f=>`<div class="li"><span>${f.n}<br><span class="mute">P${r1(f.p)} C${r1(f.c)} F${r1(f.f)}</span></span><span>${Math.round(f.k)} kcal <button onclick="delF(${f.i})" aria-label="delete">×</button></span></div>`).join(''):'<p class="mute">Nothing logged.</p>'}</div>`}).join('')}
<details><summary>Weekly meal plan & grocery list</summary><div class="grid">${DN.map((n,i)=>`<div class="card"><h3>${n}</h3>${MEALS.map((m,j)=>`<label>${m}</label><input value="${(S.meal[i+'_'+j]||'').replace(/"/g,'&quot;')}" onchange="S.meal['${i}_${j}']=this.value;save()">`).join('')}</div>`).join('')}<div class="card"><h3>Grocery list</h3><textarea style="min-height:220px" onchange="S.groc=this.value;save()">${S.groc}</textarea></div></div></details>`};
V.prog=()=>{const w=S.wts,ms=S.ms,t=T(),ch=w.length>1?r1(w[w.length-1].w-w[0].w):0,mp=ms.filter(m=>m[met]).map(m=>({x:m.d,y:+m[met]}));
return`<h2>Progress</h2><div class="card"><h3>Body weight (kg)</h3><div class="row"><input id="pw" type="number" step=".1" placeholder="e.g. 74.8"><input id="pd" type="date" value="${TODAY}"><button class="b n" onclick="addW($('#pw').value,$('#pd').value)">Add</button></div><br>${chart(w.slice(-20).map(x=>({x:x.d,y:x.w})))}<div class="stats" style="margin-top:12px"><div class="st a"><b>${w.length?w[w.length-1].w:'-'}</b><span>current kg</span></div><div class="st"><b>${ch>0?'+':''}${ch}</b><span>change kg</span></div><div class="st"><b>${t.bmi}</b><span>BMI</span></div></div></div>
<div class="card"><h3>Body measurements (cm)</h3><div class="g2">${['waist','chest','hips','arm','thigh'].map(k=>`<div><label>${k}</label><input id="m_${k}" type="number" step=".1"></div>`).join('')}</div><button class="b" onclick="addM()">Save measurements</button><br><br><label>Chart</label><select onchange="met=this.value;render()">${['waist','chest','hips','arm','thigh'].map(k=>`<option ${k===met?'selected':''}>${k}</option>`).join('')}</select><br><br>${chart(mp.slice(-20))}
${ms.length?`<br><table><tr><th>Date</th><th>Waist</th><th>Chest</th><th>Hips</th><th>Arm</th><th>Thigh</th></tr>${ms.slice(-8).reverse().map(m=>`<tr><td>${m.d}</td><td>${m.waist||''}</td><td>${m.chest||''}</td><td>${m.hips||''}</td><td>${m.arm||''}</td><td>${m.thigh||''}</td></tr>`).join('')}</table>`:''}</div>`};
V.calc=()=>{const p=S.p,t=T();
return`<h2>Calorie & Macro Calculator</h2><div class="card"><div class="g2"><div><label>Name</label><input id="p_name" value="${p.name}"></div><div><label>Sex</label><select id="p_sex"><option value="m" ${p.sex==='m'?'selected':''}>Male</option><option value="f" ${p.sex==='f'?'selected':''}>Female</option></select></div><div><label>Age</label><input id="p_age" type="number" value="${p.age}"></div><div><label>Height (cm)</label><input id="p_ht" type="number" value="${p.ht}"></div><div><label>Weight (kg)</label><input id="p_wt" type="number" step=".1" value="${p.wt}"></div></div><div class="g2"><div><label>Activity</label><select id="p_act">${[[1.2,'Desk job, little exercise'],[1.375,'Train 1-3 days'],[1.55,'Train 3-5 days'],[1.725,'Train 6-7 days'],[1.9,'Athlete / physical job']].map(a=>`<option value="${a[0]}" ${p.act==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div><label>Goal</label><select id="p_goal">${[[-.25,'Lose fat fast (-25%)'],[-.2,'Lose fat (-20%)'],[-.1,'Slow cut (-10%)'],[0,'Maintain'],[.1,'Build muscle (+10%)']].map(a=>`<option value="${a[0]}" ${p.goal==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div></div><button class="b" onclick="saveP()">Calculate & save</button></div>
<div class="stats"><div class="st a"><b>${t.cal}</b><span>daily calories</span></div><div class="st"><b>${t.pro}g</b><span>protein</span></div><div class="st"><b>${t.carb}g</b><span>carbs</span></div><div class="st"><b>${t.fat}g</b><span>fat</span></div><div class="st"><b>${t.bmr}</b><span>BMR (kcal)</span></div><div class="st"><b>${t.tdee}</b><span>maintenance</span></div><div class="st"><b>${t.bmi}</b><span>BMI</span></div><div class="st"><b>${t.water}</b><span>glasses water</span></div></div>
<p class="mute" style="margin-top:12px">Healthy weight range for your height: ${t.lo}-${t.hi} kg. Estimates use the Mifflin-St Jeor formula. This is general information, not medical advice.</p>`};
V.data=()=>`<h2>Backup & Settings</h2><div class="card"><h3>Your data is saved on this device only</h3><p class="mute" style="margin-bottom:12px">Everything is stored in this browser. Clearing browser data erases it, so download a backup now and then. Use the same browser each time you open this file.</p><div class="row"><button class="b" onclick="exp()">Download backup</button><div><label>Restore backup file</label><input type="file" accept=".json" onchange="imp(this)"></div></div></div><div class="card"><h3>Print this page</h3><button class="b s" onclick="print()">Print / Save as PDF</button></div><div class="card"><h3>Erase everything</h3><button class="b d" onclick="if(confirm('Delete ALL data? This cannot be undone.')){localStorage.removeItem(K);S=def();render()}">Reset app</button></div>`;
/* ---------- actions ---------- */
function setW(n){const d=dl(TODAY);d.water=d.water===n?n-1:n;save();render()}
function addW(v,d){v=parseFloat(v);if(!v)return;d=d||TODAY;S.wts=S.wts.filter(x=>x.d!==d);S.wts.push({d,w:v});S.wts.sort((a,b)=>a.d<b.d?-1:1);S.p.wt=v;save();render()}
function addM(){const m={d:TODAY};let any=0;['waist','chest','hips','arm','thigh'].forEach(k=>{const v=$('#m_'+k).value;if(v){m[k]=v;any=1}});if(!any)return;S.ms=S.ms.filter(x=>x.d!==TODAY);S.ms.push(m);save();render()}
function lx(i,k,f,v){const o=lg(wkDates()[i]);o[k]=o[k]||{};o[k][f]=v;save();if(f==='d')render()}
function ep(i,v){const l=v.split('\n').map(s=>s.trim()).filter(Boolean);S.plan[i]={t:l[0]||'Rest',ex:l[0]&&l[0].toLowerCase()==='rest'?[]:l.slice(1)};save();render()}
function loadT(){const k=$('#tp').value;if(!confirm('Replace your current weekly plan with this template?'))return;S.tpl=k;S.plan=TPL[k].d.map(a=>({t:a[0],ex:a.slice(1)}));save();render()}
function addF(){const f=FOODS[$('#ff').value],q=+$('#fq').value||1;(S.food[fd]=S.food[fd]||[]).push({m:$('#fm').value,n:(q!==1?q+'x ':'')+f[0],k:f[1]*q,p:f[2]*q,c:f[3]*q,f:f[4]*q});save();render()}
function addC(){const n=$('#cn').value.trim();if(!n)return;(S.food[fd]=S.food[fd]||[]).push({m:$('#cm').value,n,k:+$('#ck').value||0,p:+$('#cp').value||0,c:+$('#cc').value||0,f:+$('#cf').value||0});save();render()}
function delF(i){S.food[fd].splice(i,1);save();render()}
function saveP(){const p=S.p;p.name=$('#p_name').value;p.sex=$('#p_sex').value;p.age=+$('#p_age').value||28;p.ht=+$('#p_ht').value||172;p.wt=+$('#p_wt').value||75;p.act=+$('#p_act').value;p.goal=+$('#p_goal').value;save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='forma-backup-'+TODAY+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(def(),JSON.parse(r.result));save();render();alert('Backup restored.')}catch(e){alert('That file could not be read.')}};r.readAsText(f)}
/* ---------- shell ---------- */
const TABS=[['today','🏠','Today'],['work','🏋️','Workout'],['diet','🍽️','Diet'],['prog','📈','Progress'],['calc','🧮','Calculator'],['data','💾','Backup']];
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');$('#hello').textContent=S.p.name?'Hi, '+S.p.name:new Date().toDateString();const y=scrollY;$('#app').innerHTML=V[tab]();scrollTo(0,y)}
render();
</script></body></html>
